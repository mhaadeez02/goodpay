<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Visa Card Silhouette Icon in Background -->
  <rect x="76" y="116" width="360" height="220" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="3"/>
  <rect x="76" y="156" width="360" height="36" fill="#000" opacity="0.6"/>

  <!-- Chip Icon -->
  <rect x="110" y="210" width="54" height="42" rx="8" fill="url(#goldGrad)"/>

  <!-- Glowing Neon Letter G & GoodPay Brand -->
  <circle cx="256" cy="270" r="110" fill="rgba(0, 240, 255, 0.08)" filter="url(#glow)"/>
  
  <text x="256" y="325" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="160" text-anchor="middle" fill="url(#cyanGrad)" filter="url(#glow)">G</text>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="40" text-anchor="middle" fill="#FFFFFF" letter-spacing="4">
    GOOD<tspan fill="url(#cyanGrad)">PAY</tspan>
  </text>
  <text x="256" y="455" font-family="'Inter', sans-serif" font-weight="600" font-size="20" text-anchor="middle" fill="#94A3B8" letter-spacing="6">
    VISA CARD APP
  </text>
</svg>
