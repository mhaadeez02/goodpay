name: Keep Render App Awake

on:
  schedule:
    # Runs every 10 minutes to prevent the 15-minute sleep cycle
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the server
        # Replace YOUR_RENDER_APP_URL.onrender.com with your actual Render URL
        run: curl -s https://goodpay-blrh.onrender.com/ > /dev/null
